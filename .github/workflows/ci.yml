name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python Parser & Profiles (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run Python test suite & conformance
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: pytest -v python/tests

  rust:
    name: Rust Parser, Formatter & WASM32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Run cargo test (stdlib, conformance, fixtures, profiles)
        working-directory: rust
        run: cargo test
      - name: Run cargo clippy
        working-directory: rust
        run: cargo clippy -- -D warnings
      - name: Check wasm32-unknown-unknown target
        working-directory: rust
        run: cargo check --target wasm32-unknown-unknown

  blender:
    name: Blender Extension & Third-Party Libraries
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "5.3.0"
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSfL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Cache third-party libraries
        uses: actions/cache@v4
        with:
          path: ~/.cache/base-node/libraries
          key: libraries-${{ hashFiles('base-node-for-blender/tests/libraries/*.toml') }}
      - name: Run extension tests
        run: >-
          ~/blender/blender --background --factory-startup --python-exit-code 1
          --python base-node-for-blender/tests/test_extension.py
      - name: Run third-party libraries non-regression
        if: success() || failure()
        run: >-
          ~/blender/blender --background --factory-startup --python-exit-code 1
          --python base-node-for-blender/tests/test_libraries.py
